x-pg: &pg
  PGHOST: ${DB_HOST:?Configurar DB_HOST}
  PGPORT: "5432"
  PGDATABASE: ${DB_NAME:-postgres}
  PGUSER: ${DB_USER:-memos_app}
  PGPASSWORD: ${DB_PASSWORD:?Configurar clave}
  PGSSLMODE: ${DB_SSLMODE:-verify-full}
  PGSSLROOTCERT: ${DB_SSLROOTCERT-/certs/ca.crt}
  PGCONNECT_TIMEOUT: "15"
services:
  preflight:
    image: postgres:17-alpine
    restart: "no"
    environment:
      <<: *pg
      SUPABASE_DEDICATED_CONFIRMED: ${SUPABASE_DEDICATED_CONFIRMED:-false}
      SUPABASE_DATA_API_DISABLED: ${SUPABASE_DATA_API_DISABLED:-false}
      BOOTSTRAP_MODE: "false"
    volumes: [./certs:/certs:ro, ./ops:/opt/hefesto:ro]
    entrypoint: [sh, /opt/hefesto/preflight.sh]
  permissions:
    image: postgres:17-alpine
    restart: "no"
    user: "0"
    entrypoint: [sh, -ec, 'chown -R 10001:10001 /files; chmod 700 /files']
    volumes: [files:/files]
  app:
    image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      preflight: {condition: service_completed_successfully}
      permissions: {condition: service_completed_successfully}
    environment:
      TZ: America/Santiago
      MEMOS_PORT: "5230"
      MEMOS_DATA: /var/opt/memos
      MEMOS_DRIVER: postgres
      MEMOS_DSN: postgres://${DB_USER:-memos_app}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME:-postgres}?sslmode=${DB_SSLMODE:-verify-full}&sslrootcert=${DB_SSLROOTCERT-/certs/ca.crt}&connect_timeout=15
      MEMOS_INSTANCE_URL: ${PUBLIC_URL:?Configurar URL HTTPS}
      MEMOS_LOG_LEVEL: info
    expose: ["5230"]
    volumes: [files:/var/opt/memos, ./certs:/certs:ro]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5230/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  dbtools:
    image: postgres:17-alpine
    profiles: [tools]
    environment: *pg
    volumes: [./certs:/certs:ro, ./ops:/opt/hefesto:ro]
  filetools:
    image: postgres:17-alpine
    profiles: [tools]
    user: "0"
    volumes: [files:/files]
volumes:
  files:
    name: ${VOLUME_PREFIX:-hefesto-notas}-files
